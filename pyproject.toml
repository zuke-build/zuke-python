[project]
name = "zuke"
version = "0.0.0"
description = "Zuke for Python: author your build as typed Python, run it on the Zuke engine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "the Zuke contributors" }]
requires-python = ">=3.12"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Build Tools",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://zuke.build"
Repository = "https://github.com/zuke-build/zuke-python"
Engine = "https://github.com/zuke-build/zuke"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zuke"]

[dependency-groups]
dev = [
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-asyncio>=1.4.1.post1",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
# The generator's goldens are its raw output, before ruff formats it.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# Every rule set that catches a defect or an untyped surface; the style sets
# ruff format already settles are left to it.
select = [
  "ANN", # every function annotated
  "B",   # bugbear
  "C4",  # comprehensions
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # import order
  "N",   # naming
  "PL",  # pylint
  "RUF", # ruff's own
  "S",   # bandit: subprocess and input handling
  "SIM", # simplify
  "T20", # no stray print
  "UP",  # modern syntax
  "W",   # pycodestyle warnings
]
ignore = [
  "PLR2004", # a literal in a comparison is often the clearest spelling
]

[tool.ruff.lint.per-file-ignores]
# The tool.call fields, as the engine names them, are the call's arguments.
"src/zuke/_facade.py" = ["PLR0913", "PLR0917"]
# Generated from the engine's tool spec: a docstring is the wrapper's own, and
# a task takes as many arguments as the wrapper's does.
"src/zuke/tools/*.py" = ["E501", "PLR0913", "PLR0917", "RUF001", "RUF002"]
# A test may assert, hold a fake token, and run a subprocess by argv.
"tests/**" = ["S101", "S105", "S603"]
# A test runs a build file's last line as if it were the main module, and one
# defines a build with a forward reference, which is a NameError in a class body.
"tests/test_run.py" = ["S102"]
"tests/test_build.py" = ["S102"]

[tool.pyright]
include = ["src", "tests", "build.py"]
extraPaths = ["tests", "."]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = true
reportUnnecessaryTypeIgnoreComment = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=zuke --cov-branch --cov-report=term-missing --cov-fail-under=95 -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["zuke"]
# Generated from the engine's tool spec; the generator's golden tests prove it.
omit = ["*/zuke/tools/*"]
