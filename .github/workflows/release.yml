name: Release
"on":
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false
jobs:
  release:
    name: "Maintain the release PR, and publish a cut release"
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@517dc954200eae7c54125406675c329fa8cfb811 # v1.0.9
        with:
          egress-policy: audit
          persist-credentials: "false"
      - name: Maintain the release PR and cut the release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Install uv
        if: steps.release.outputs.release_created
        shell: bash
        run: pipx install uv
      - name: Sync the locked environment
        if: steps.release.outputs.release_created
        shell: bash
        run: uv sync --locked
      - name: Publish to PyPI with Zuke
        if: steps.release.outputs.release_created
        run: ./zuke publish
      - name: Sync the API reference to the website with Zuke
        if: steps.release.outputs.release_created
        run: ./zuke sync_website
        env:
          ZUKE_BUILD_APP_ID: "${{ secrets.ZUKE_BUILD_APP_ID }}"
          ZUKE_BUILD_APP_KEY: "${{ secrets.ZUKE_BUILD_APP_KEY }}"
