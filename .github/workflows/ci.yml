name: CI
"on":
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
permissions: {}
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  # The same gate a contributor runs locally with `uv run poe ci`, on the three
  # operating systems the engine supports. Once the Zuke engine can host a
  # Python worker, this job becomes `./zuke ci` against a Python build file,
  # as the main repository does.
  ci:
    name: "Gate (${{ matrix.os }})"
    runs-on: "${{ matrix.os }}"
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        run: pipx install uv
        shell: bash
      - name: Sync the locked environment
        run: uv sync --locked
        shell: bash
      - name: Run the gate
        run: uv run poe ci
        shell: bash
