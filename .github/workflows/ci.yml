name: CI
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  ci:
    name: "Gate (${{ matrix.os }})"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@517dc954200eae7c54125406675c329fa8cfb811 # v1.0.9
        with:
          egress-policy: audit
          persist-credentials: "false"
      - name: Install uv
        shell: bash
        run: pipx install uv
      - name: Sync the locked environment
        shell: bash
        run: uv sync --locked
      - name: Run the gate with the bash launcher
        if: "runner.os != 'Windows'"
        run: ./zuke ci
      - name: Run the gate with the PowerShell launcher
        if: "runner.os == 'Windows'"
        shell: pwsh
        run: ./zuke.ps1 ci
      - name: Check the generated workflow is current
        if: "runner.os != 'Windows'"
        run: ./zuke generate-ci --check
